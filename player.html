<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фаэрун — экран игроков</title>
<link rel="stylesheet" href="assets/fonts.css?v=e0729c15">
<link rel="stylesheet" href="css/style.css?v=e0729c15">
</head>
<body class="player">
<canvas id="gl"></canvas>
<canvas id="map"></canvas>
<div id="hint" class="floating">
  <b>Экран игроков</b><br>
  F или двойной клик — полный экран · колесо — масштаб · клик — пинг
  <div id="conn"></div>
</div>
<div id="pnotice" class="hidden"></div>
<div id="placeCard" class="hidden"><div class="pkind"></div><h3></h3><p></p></div>
<div id="bootError" style="display:none;position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:99;max-width:80vw;background:#5a2420;color:#fff;padding:12px 16px;border-radius:8px;font:14px system-ui;white-space:pre-wrap"></div>
<script>
  window.__bootErr = function (m) { var e = document.getElementById('bootError'); e.style.display = 'block'; e.textContent += (e.textContent ? '\n' : '') + '⚠ ' + m; };
  window.addEventListener('error', function (e) { __bootErr((e.message || 'ошибка загрузки') + (e.filename ? ' — ' + e.filename.split('/').pop() : '')); });
  window.addEventListener('unhandledrejection', function (e) { __bootErr(String(e.reason && e.reason.message || e.reason)); });
  setTimeout(function () { if (!window.__appStarted) __bootErr('Приложение не запустилось. Обновите страницу с очисткой кэша (Ctrl+F5). Если не поможет — пришлите этот текст.'); }, 8000);
</script>
<script type="module" src="js/player.js?v=e0729c15"></script>
</body>
</html>
